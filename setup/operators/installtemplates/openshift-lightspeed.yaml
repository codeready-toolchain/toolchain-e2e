apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: install-openshift-lightspeed-operator
objects:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: ${OLS_NAMESPACE}
  - apiVersion: operators.coreos.com/v1
    kind: OperatorGroup
    metadata:
      name: openshift-lightspeed
      namespace: ${OLS_NAMESPACE}
    spec:
      targetNamespaces:
      - ${OLS_NAMESPACE}
      upgradeStrategy: Default
  - apiVersion: operators.coreos.com/v1alpha1
    kind: Subscription
    metadata:
      name: lightspeed-operator
      namespace: ${OLS_NAMESPACE}
    spec:
      channel: alpha
      installPlanApproval: Automatic
      name: lightspeed-operator
      source: redhat-operators
      sourceNamespace: openshift-marketplace
      config:
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 2Gi
parameters:
  - name: OLS_NAMESPACE
    value: openshift-lightspeed
